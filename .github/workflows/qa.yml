name: QA Kuxtal (en la nube)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1 (pin por SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0 (pin por SHA)
        with:
          node-version: '20'
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.48
          npx playwright install --with-deps chromium
      - name: Correr QA (responsive + errores + piezas)
        run: node qa/check.mjs
      - name: Panel de personas (escapado y reglas de la pantalla)
        run: node qa/panel-personas.mjs
      - name: Embudo (reparto, hora de Guatemala, resultado de la llamada)
        run: node qa/marco.mjs
      - name: Mi día del telemarketer (escapado y lo mínimo a la vista)
        run: node qa/mi-dia.mjs
      - name: Citas y carta (horarios, consentimiento, escapado)
        run: node qa/citas.mjs
      - name: Sala (bloque 4)
        run: node qa/sala.mjs
      - name: Verificación y descuentos (bloque 5)
        run: node qa/verificacion.mjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed   # v2.0.5 (pin por SHA)
        with:
          deno-version: v2.x
      - name: Función kuxtal-personas (Supabase simulado)
        run: deno test supabase/functions/kuxtal-personas/
